@Kopernicus:HAS[@JNSQReborn_Configuration:HAS[#SystemScale[Real]]]:AFTER[JNSQ-Reborn]
{
	@Body[JNSQGilly]
	{
		@Properties
		{
			@radius *= 4
			@timewarpAltitudeLimits[*, ] *= 1.5
			@navballSwitchRadiusMult = 0.09
			@navballSwitchRadiusMultLow = 0.081
			@ScienceValues
			{
				@spaceAltitudeThreshold *= 4
			}
		}
		@Orbit
		{
			@semiMajorAxis *= 4
		}
		@ScaledVersion
		{
			@fadeStart += 30000
			@fadeEnd += 30000
		}
		@PQS
		{
			@fadeStart += 30000
			@fadeEnd += 40000
			@deactivateAltitude += 40000
			@Material
			{
				@steepPower *= 1.5
				@steepTexEnd *= 2
			}
			@Mods
			{
				@VertexHeightMap
				{
					@offset *= 4
					@deformity *= 4
				}
				@VertexHeightNoise
				{
					@deformity *= 4
				}
				@VertexSimplexHeight
				{
					@deformity *= 4
				}
				@VoronoiCraters,*
				{
					@deformation *= 4
				}
				@LandControl
				{
					@vHeightMax *= 4
					@scatters
					{
						@Scatter[boulder]
						{
							@maxScale += 1
						}
					}
				}
			}
		}
	}
}