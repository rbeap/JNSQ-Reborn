@Kopernicus:HAS[@JNSQReborn_Configuration:HAS[#SystemScale[Real]]]:AFTER[JNSQ-Reborn]
{
	@Body[JNSQVall]
	{
		@Properties
		{
			@radius *= 4
			@timewarpAltitudeLimits[*, ] *= 1.5
			@navballSwitchRadiusMult = 0.02
			@navballSwitchRadiusMultLow = 0.018
			@ScienceValues
			{
				@spaceAltitudeThreshold *= 4
			}
		}
		@Orbit
		{
			@semiMajorAxis *= 4
		}
		@ScaledVersion
		{
			@fadeStart += 30000
			@fadeEnd += 30000
		}
		@PQS
		{
			@maxLevel = 12
			@fadeStart += 30000
			@fadeEnd += 40000
			@deactivateAltitude += 40000
			@Material
			{
				@steepPower *= 1.5
				@steepTexEnd *= 2
			}
			@Mods
			{
				@VertexHeightMap
				{
					@offset *= 2.5
					@deformity *= 2.5
				}
				@VertexSimplexHeightAbsolute
				{
					@deformity *= 2.5
				}
				@VertexHeightNoiseVertHeightCurve2
				{
					@deformity *= 2.5
					@simplexHeightEnd *= 2.5
					@simplexHeightStart *= 2.5
				}
				@VertexRidgedAltitudeCurve
				{
					@deformity *= 2.5
					@simplexHeightEnd *= 2.5
					@simplexHeightStart *= 2.5
				}
				@LandControl
				{
					@vHeightMax *= 2.5
					@scatters
					{
						@Scatter[boulder]
						{
							@maxScale += 1
						}
					}
				}
			}
		}
	}
}