	@OBJECT:HAS[#body[JNSQEve]]
	{
		@altitude *= 2
		@scaledFadeStartAltitude *= 1.5
		@scaledFadeEndAltitude *= 1.5
		@layerRaymarchedVolumeV5
		{
			@scaledFadeStartAltitude *= 1.5
			@scaledFadeEndAltitude *= 1.5
			@cloudTypes
			{
				@Item,*
				{
					@maxAltitude *= 1.33
					@minAltitude *= 1.15
                   		 	@baseNoiseTiling *= 3
				}
			}
		}
	}
