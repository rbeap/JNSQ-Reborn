@Kopernicus:HAS[@JNSQReborn_Configuration:HAS[#SystemScale[Real]]]:AFTER[zJNSQ-Reborn]
{
	@Asteroid:HAS[#name[RebornMainAsteroidBelt]]
	{
		@Locations
		{
			@Around
			{
				@Body
				{
					@semiMajorAxis
					{
						@minValue *= 4
						@maxValue *= 4
					}
				}
			}
		}
	}
	@Asteroid:HAS[#name[RebornTransLindorianObjects]]
	{
		@Locations
		{
			@Around
			{
				@Body
				{
