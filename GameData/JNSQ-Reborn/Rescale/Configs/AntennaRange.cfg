// For JNSQ at real scale (10x), the following game difficulty settings are recommended: Range modifier = 1, DSN modifier = 16.
// The following patch increases the base antenna range modifier by 4x to 16x (don't change in game as this produces a bug).

// Stock or NF Exploration

@PART:HAS[@MODULE[ModuleDataTransmitter*]:HAS[@JNSQReborn_Configuration:HAS[#SystemScale[Real]]]]:AFTER[zJNSQ-Reborn]
{
	@MODULE[ModuleDataTransmitter],*
	{
		@antennaPower *= 4
		@UPGRADES
		{
			@UPGRADE,*
			{
				@antennaPower *= 4
			}
		}
	}
	@MODULE[ModuleDataTransmitterFeedeable],*:NEEDS[NearFutureExploration]
	{
		@antennaPower *= 4
		@UPGRADES
		{
			@UPGRADE,*
			{
				@antennaPower *= 4
			}
		}
	}
}

// RemoteTech

@PART:HAS[@MODULE[ModuleRTAntenna*]&@JNSQReborn_Configuration:HAS[#SystemScale[Real]]]:NEEDS[RemoteTech]:AFTER[zJNSQ-Reborn]
{
	@MODULE[ModuleRTAntenna*]
	{
		@OmniRange *= 4
		@Mode1OmniRange *= 4
		@Mode1DishRange *= 4
	}
}

// Breaking Ground

@PART:HAS[@MODULE[ModuleGroundExpControl]&@JNSQReborn_Configuration:HAS[#SystemScale[Real]]]:AFTER[zJNSQ-Reborn]
{
	@MODULE[ModuleGroundExpControl]
	{
		@antennaPower *= 4
	}
}

@PART:HAS[@MODULE[ModuleGroundCommsPart]&@JNSQReborn_Configuration:HAS[#SystemScale[Real]]]:AFTER[zJNSQ-Reborn]
{
	@MODULE[ModuleGroundCommsPart]
	{
		@antennaPower *= 4
	}
}

// Near Future Exploration

@PART:HAS[@MODULE[ModuleDeployableReflector]&@JNSQReborn_Configuration:HAS[#SystemScale[Real]]]:NEEDS[NearFutureExploration]:AFTER[zJNSQ-Reborn]
{
	@MODULE[ModuleDeployableReflector]
	{
		@AddedRange *= 4
	}
}
