JNSQReborn_Configuration
{
	// RealTime = True - Use a realistic calendar (1st January, 2001)
	// RealTime = False - Use stock calendar (Year 1, Day 1)

	RealTime = True

	// KSCParallaxMask = True  - Trees around KSC
	// KSCParallaxMask = False - No trees around the KSC
	
	// On Real Scale this is turned off entirely

	KSCParallaxMask = True

	// SystemScale = Standard  - All bodies at standard JNSQ scale (2.7x Stock)
	// SystemScale = Real   - All bodies at real-world scale (10x Stock)
 
	SystemScale = Standard
}









































///-----------------------------------------///
/// DO NOT TOUCH ANY VALUES BELOW THIS LINE ///
///-----------------------------------------///

@Kopernicus:FIRST
{
	%JNSQR_KSCMask = #$@JNSQReborn_Configuration/KSCParallaxMask$
}
@Kopernicus:FOR[JNSQ-Reborn]
{
	JNSQReborn_Configuration
	{
		SystemScale = #$@JNSQReborn_Configuration/SystemScale$
	}
}
@Scatterer_atmosphere:FOR[JNSQ-Reborn]
{
    JNSQReborn_Configuration
    {
        SystemScale = #$@JNSQReborn_Configuration/SystemScale$
    }
}
@EVE_CLOUDS:FOR[JNSQ-Reborn]
{
    JNSQReborn_Configuration
    {
        SystemScale = #$@JNSQReborn_Configuration/SystemScale$
    }
}
@KK_GroupCenter:FOR[JNSQ-Reborn]
{
    JNSQReborn_Configuration
    {
        SystemScale = #$@JNSQReborn_Configuration/SystemScale$
    }
}
@ParallaxScatters:FOR[JNSQ-Reborn]
{
