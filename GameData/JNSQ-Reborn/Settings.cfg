JNSQReborn_Configuration
{

	// RealTime = True - Use a realistic calendar (1st January, 2001)
	// RealTime = False - Use stock calendar (Year 1, Day 1)

	RealTime = True

	// KSCParallaxMask = True  - Trees around KSC 
	// KSCParallaxMask = False - No trees around the KSC whatsoever

	KSCParallaxMask = True
}















































///-----------------------------------------///
/// DO NOT TOUCH ANY VALUES BELOW THIS LINE ///
///-----------------------------------------///

@Kopernicus:FIRST
{
	%JNSQR_KSCMask = #$@JNSQReborn_Configuration/KSCParallaxMask$
}

@Kopernicus:AFTER[ParallaxStock]:NEEDS[JNSQ-Reborn]:HAS[#JNSQR_KSCMask[True]]
{
	@Body[JNSQKerbin]
	{
		%PQS
		{
			%Mods
			{
				!MapDecalVertexRemoveScatter:HAS[#name[ParallaxMaskKSC]]
				MapDecalVertexRemoveScatter
				{
					name = ParallaxMaskKSC
					BlockedScatters
					{
						name = OakTree
						name = PineTree
						name = KerbinShrub
						name = Roses
					}
					Position
					{
						latitude = -0.035
						longitude = -91.807
					}
					colorMap = JNSQ-Reborn/Textures/KSCMask.dds
					angle = -1
					radius = 3200
					order = 99999
				}
			}
		}
	}
	!JNSQR_KSCMask {}
}

@Kopernicus:AFTER[ParallaxStock]:NEEDS[JNSQ-Reborn]:HAS[#JNSQR_KSCMask[False]]
{
	@Body[JNSQKerbin]
	{
		%PQS
		{
			%Mods
			{
				!MapDecalVertexRemoveScatter:HAS[#name[ParallaxMaskKSC]]
				MapDecalVertexRemoveScatter
				{
					name = ParallaxMaskKSC
					BlockedScatters
					{
						name = OakTree
						name = PineTree
						name = KerbinShrub
						name = Roses
					}
					Position
					{
						latitude = -0.035
						longitude = -91.807
					}
					colorMap = JNSQ-Reborn/Textures/KSCMask2.dds
					angle = -1
					radius = 3200
					order = 99999
				}
			}
		}
	}
	!JNSQR_KSCMask {}
}

@Kronometer:FIRST
{
	%RealTime = #$@JNSQReborn_Configuration/RealTime$
}

@Kronometer:AFTER[Kronometer]:HAS[#RealTime[True]]
{
	%useHomeDay = true
	%useHomeYear = true
	%resetMonthNumAfterMonths = 12
	%resetMonthsAfterYears = 1
	!DisplayDate,* {}
	!Months,* {}

	DisplayDate
	{
		PrintDate
		{
			offsetTime = 21600
			offsetDay = 1
			offsetYear = 2001
			displayDate = <Dm><Dmth> <Mo1>, <Y>
			displayTime = < - <H:00>:<M:00>
			displaySeconds = :<S:00>
		}

		PrintDateNew
		{
			offsetTime = 21600
			offsetDay = 1
			offsetYear = 2001
			displayDate = <Dm><Dmth> <Mo1>, <Y>
			displayTime = < - <H:00>:<M:00>
			displaySeconds = :<S:00>
		}

		PrintDateCompact
		{
			offsetTime = 21600
			offsetDay = 1
			offsetYear = 2001
			displayDate = <Dm><Dmth> <Mo1>, <Y>
			displayTime = < - <H:00>:<M:00>
			displaySeconds = :<S:00>
		}
	}
	Months
	{
		Month
		{
			name = January
			symbol = Jan
			days = 31
		}
		Month
		{
			name = February
			symbol = Feb
			days = 28
		}
		Month
		{
			name = March
			symbol = Mar
			days = 31
		}
		Month
		{
			name = April
			symbol = Apr
			days = 30
		}
		Month
		{
			name = May
			symbol = May
			days = 31
		}
		Month
		{
			name = June
			symbol = Jun
			days = 30
		}
		Month
		{
			name = July
			symbol = Jul
			days = 31
		}
		Month
		{
			name = August
			symbol = Aug
			days = 31
		}
		Month
		{
			name = September
			symbol = Sep
			days = 30
		}
		Month
		{
			name = October
			symbol = Oct
			days = 31
		}
		Month
		{
			name = November
			symbol = Nov
			days = 30
		}
		Month
		{
			name = December
			symbol = Dec
			days = 31
		}
	}
	!RealTime {}
}

@Kronometer:AFTER[Kronometer]:HAS[#RealTime[False]]
{
	@useHomeDay = true
	@useHomeYear = true
	!RealTime {}
}