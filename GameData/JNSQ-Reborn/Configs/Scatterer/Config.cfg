@Scatterer_config:AFTER[Scatterer]
{
	@m_fourierGridSize = 64
	@terrainShadows = False
	@shadowsDistance = 5000
}

@Scatterer_atmosphere:LAST[scattererJNSQ]
{
    !Atmo:HAS[JNSQTag] {}
}

@Scatterer_ocean:LAST[scattererJNSQ]
{
	!Ocean:HAS[#name[Eve]] {}
	!Ocean:HAS[#name[Kerbin]] {}
	!Ocean:HAS[#name[Laythe]] {}
	!Ocean:HAS[#name[Huygen]] {}
}
@Scatterer_config:LAST[zJNSQ]
{
	@fullLensFlareReplacement = True
}