// ============================================================================
// GeigerCounter science experiment definitions
// ============================================================================

@EXPERIMENT_DEFINITION[*]:HAS[#id[geigerCounter]]:NEEDS[JNSQ-Reborn]:AFTER[KerbalismDefault]
{
	@RESULTS
	{
		HuygenSrfLanded = Huygen's surface radiation levels are nearly as low as Kerbin!
		HuygenFlyingLow = The atmosphere of Huygen is remarkably good at shielding the surface from radiation. The is likely due to high pressure and composition.
		HuygenFlyingHigh = Lindor's magnetosphere ionises Huygen's thick atmosphere in strange ways.
		HuygenInSpaceLow = The beautiful scenic views of Lindor and Huygen temporarily cease R&D's insistence on checking the Geiger counter.
		HuygenInSpaceHigh = Lindor's radiation influence has dropped to a lower than expected level.
		LindorFlyingLow = Lindor has a strange convective fluid in it's lower atmosphere that disrupts the magnetosphere.
		LindorFlyingHigh = The internal dynamo of Lindor is very different from other gas giants. R&D wants to further study this, but you just want to get back to Kerbin.
		LindorInSpaceLow = The detected magnetosphere of Lindor is relatively low for a gas giant. It will still give you cancer on your cancer though...
		LindorInSpaceHigh = Interestingly, Lindor's magnetosphere is tilted away from the axis of rotation.
	}
}

