@RESEARCHBODIES:HAS[#name[JNSQ]]:NEEDS[ResearchBodies,JNSQ]:AFTER[JNSQ]
{
	!ONDISCOVERY {}
	!IGNORE {}
	!IGNORELEVELS {}
}
RESEARCHBODIES
{
	loadAs = mod
	name = JNSQ-Reborn
	ONDISCOVERY
	{
		JNSQMoho = So hot. This is one of the first things we thought after discovering Moho. If one day we want to explore it, we'll have to care about temperature.
		JNSQEve = Our instruments are so powerful that we were able to see a purple dot in the sky. Bob named it Eve. First, we thought it was an ice cream like Minmus, but then scientists at R&D said it's impossible that close to the Sun.
		JNSQGilly = The ultimate question for the time being is: How did we do to find Gilly?
		JNSQMinmus = Jeb will be happy. A new ice cream world named Minmus has just been found orbiting around Kerbin! So close! You won't need snacks anymore if you're going there.
		JNSQDuna = For a long time, maybe for thousands of years, we saw a red dot in the sky. A star? Snacks???! We weren't able to tell. Unfortunately, we are sure it's not snacks. It's Duna.
		JNSQIke = What is this big thing here? I prefer the awesome Duna's red! Ike is apparently orbiting Duna.
		JNSQDres = We've just discovered Dres, a small grey planet orbiting around the Sun.
		JNSQJool = Well... Guys, we discovered Jool, a big kerb... planet, gas planet.
		JNSQLaythe = First we thought we saw Kerbin in a mirror, but we didn't. This is Laythe.
		JNSQVall = Vall's incredibly looking like Minmus, said Bobak Kerman at KSC.
		JNSQTylo = We didn't discovered a 'normal' body for a long time now, said scientists at R&D after discovering Tylo.
		JNSQBop = Bop seems to be a captured asteroid, so it became a Jool's satellite.
		JNSQPol = I didn't know flowers can orbit planets! Well, Pol doesn't really come from a flower, but it could in fact as pollen.
		JNSQEeloo = So far, so cold, so white, so tiny, so whatever-you-want! This is Eeloo.
		JNSQEdna = #LOC_JNSQ_RBodies_discovery_Edna
		JNSQDak = #LOC_JNSQ_RBodies_discovery_Dak
		JNSQLindor = #LOC_JNSQ_RBodies_discovery_Lindor
		JNSQKrel = #LOC_JNSQ_RBodies_discovery_Krel
		JNSQAden = #LOC_JNSQ_RBodies_discovery_Aden
		JNSQHuygen = #LOC_JNSQ_RBodies_discovery_Huygen
		JNSQRiga = #LOC_JNSQ_RBodies_discovery_Riga
		JNSQTalos = #LOC_JNSQ_RBodies_discovery_Talos
		JNSQHamek = #LOC_JNSQ_RBodies_discovery_Hamek
		JNSQCeles = #LOC_JNSQ_RBodies_discovery_Celes
